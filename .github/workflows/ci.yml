name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (App, Node, Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Phase 8 CC0 media licensing gate.
  #
  # It gates, and it is a job of its own for one reason: it must be able to fail
  # before anything is built. The plan's Phase 8 exit criterion is that new media
  # cannot be added without CC0 metadata, and a criterion that is only checked
  # after `dist` exists has already let the artifact be built once. `web-build`
  # needs this job, so a registry without provenance, a checksum that does not
  # match the bytes on disk, an unregistered file, or an unverified asset in the
  # default PixiJS bundle stops the production artifact from being produced at all.
  #
  # There is deliberately no `npm ci` here. The checker imports nothing but Node
  # built-ins and reads only the repository, so this gate costs a checkout and a
  # Node setup, and it runs identically with or without a build. It also never
  # writes to `dist`, which keeps the run at exactly one production build.
  #
  # The step is not exempt from failing. `tests/phase8/license-gate-wiring.test.ts`
  # asserts that the job is bound, that the step runs the npm script, and that no
  # step in it carries a `continue-on-error`, so a regression to a warning cannot
  # land quietly. The wording above avoids naming that key on purpose, because that
  # same gate matches the key as a YAML key at the start of a line.
  asset-licenses:
    name: Asset Licenses (CC0 registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify every public asset against the CC0 registry
        run: npm run test:licenses

  web-build:
    name: Web Build and Bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, asset-licenses]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npm run check:bundle-size
      # Phase 9 renderer memory preflight.
      #
      # A step in this job rather than a job of its own, for the same reason as the
      # Welcome budget below: `dist` exists here and nowhere else, and the script
      # imports only Node built-ins, so it needs no install of its own.
      #
      # It is the deterministic half of plan section 10.2's renderer memory gate. It
      # reads the built artifact - it never starts a browser, never mounts a world,
      # and never claims a mount/unmount measurement. What it does establish is that
      # the entry document does not name a Pixi chunk (an eager renderer load on
      # Welcome), that every renderer chunk is within plan section 10.2's 800 KiB
      # gzip ceiling for any lazy JavaScript chunk, and that the run measured a
      # renderer at all. A missing `dist` fails rather than passing an unmeasured
      # build. The browser-backed half - 20 mount/unmount cycles, canvas count, GPU
      # memory - needs a Playwright lane and is not claimed here.
      #
      # The step is not exempt from failing. `tests/phase9/memory-gate-wiring.test.ts`
      # asserts that, so a regression to a warning cannot land quietly. The wording
      # above avoids naming that key on purpose, because that same gate matches the
      # key as a YAML key at the start of a line.
      - name: Enforce the renderer memory preflight on the built artifact
        run: npm run check:memory
      # Plan section 10.2's Welcome budget: 300 KiB gzip for initial JavaScript and
      # CSS, excluding lazy renderer bundles. It is a step in this job rather than a
      # job or a lane of its own because `dist` exists here and nowhere else, and it
      # reads the same `dist` the one `build:web` above just produced - a second build
      # would defeat the only property that makes this measurement meaningful, which
      # is that it describes the artifact that is about to be uploaded. The script
      # also needs no `npm ci` beyond what this job already installs, because it imports
      # only Node built-ins.
      #
      # The step is not exempt from failing.
      # `tests/phase8/welcome-budget-gate.test.ts` asserts that, so a regression to a
      # warning cannot land quietly and a growing Welcome shell cannot ship behind a
      # green run. The wording above avoids naming that key on purpose, because that
      # same gate matches the key as a YAML key at the start of a line.
      - name: Enforce the Welcome initial payload budget
        run: npm run check:budget:welcome
      - run: npm run record:build-metadata
      # The manifest carries two identities: the `dist` tree hash, and a hash of
      # the git-tracked source the artifact was recorded against. The tree hash
      # alone is self-referential - it is recorded from the same `dist` it later
      # describes - so a stale `dist` paired with a manifest recorded from that
      # same stale tree matched byte for byte. The source identity is what makes
      # that pairing fail. Recording and verifying in one job, on one checkout, is
      # what keeps the two satisfiable here and in every consuming job below.
      - name: Record the shared production artifact identity
        run: npm run record:web-artifact
      - name: Verify the shared production artifact identity
        run: npm run verify:web-artifact
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: web-build-metadata
          path: artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the shared production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
      # Phase 9 Pixi-flagged build lane.
      #
      # Plan section 11 requires Pixi paths to "run in CI and internal builds" before
      # cutover, and `VITE_WORLD_RENDERER` is a build-time flag, so the only way to
      # exercise it is to build with it. This is deliberately *steps in this job* and
      # not a job of its own, for the same reason the four flagged lanes are steps in
      # the storage-v2 job: one job means one `npm ci`, and the run stays at one
      # production build, one recorded artifact identity, and one upload.
      #
      # Three properties keep this from disturbing the release:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified,
      #   and uploaded. Nothing downstream reads this job's `dist` - `browser-smoke`
      #   and the four compatibility lanes download the uploaded `web-artifact`, not
      #   this runner's working directory - so the rebuild cannot be mistaken for the
      #   artifact that shipped.
      # - It records and uploads no second *production* artifact. The production
      #   default stays `VITE_WORLD_RENDERER=phaser`, and this build is a flagged one
      #   that exists to be measured and then discarded. The one thing it does upload
      #   is the flagged build's own identity, to its own manifest, and only because
      #   the browser-backed lane below measures it from a different job.
      # - It installs no browser. The renderer switch is exercised at build level
      #   here, so a pull request does not pay for a browser install to prove that a
      #   flag compiles into a working artifact. The browser-backed half of the same
      #   memory criterion is a separately gated lane, in a job that already has a
      #   browser, and is not something this step quietly becomes.
      #
      # `vite.config.ts` also enforces the lazy-chunk boundary inside every build, so
      # a Pixi build that statically reached the Pixi runtime would already have
      # failed the two steps above it rather than being measured here.
      - name: Build the Phase 9 Pixi-flagged artifact
        run: npm run build:web:pixi
      - run: npm run check:bundle-size
      - name: Enforce the renderer memory preflight on the Pixi-flagged artifact
        run: npm run check:memory
      # The browser-backed half of the same criterion, and the only thing this job
      # uploads besides the release artifact.
      #
      # `tests/phase9/memory-gate-wiring.test.ts` records this job's contract: the
      # Pixi build is a *build-level* lane, it "does not quietly become a browser
      # lane", and this job must install no browser at all. That contract is honoured
      # here - this job still installs none - and the browser-backed half runs in
      # `browser-smoke`, which already has one. That is the only lawful placement
      # left, and the reason is worth stating rather than working around:
      #
      # - the Pixi-flagged artifact can only be produced here, because eleven existing
      #   wiring gates assert that no other CI job runs any `build:web*` script;
      # - the `storage-v2-browser` job cannot receive it, because its own gate asserts
      #   that job neither downloads an artifact nor runs a `build:web*` script;
      # - `browser-smoke` already downloads an artifact, verifies it, installs one
      #   browser, and previews a `dist`, so a second artifact costs one upload and
      #   one download and no new job, no new `npm ci`, and no new browser install.
      #
      # The wording of this block deliberately avoids naming the tool whose absence
      # the gate above asserts on, because that gate matches the phrase anywhere in
      # this job's text - comments included - and a comment that spelled it out would
      # fail it. The same reason keeps the tool's name out of the steps it describes.
      #
      # The upload is the Pixi build's *own* identity, to its own manifest, so it can
      # never be mistaken for the release artifact; the lane verifies that manifest
      # before it measures anything, and `browser-smoke` runs its production suite
      # against the production artifact before this download replaces `dist`.
      - name: Record the Pixi-flagged artifact identity
        run: npm run record:web-artifact:pixi
      - name: Verify the Pixi-flagged artifact identity
        run: npm run verify:web-artifact:pixi
      - name: Upload the Pixi-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixi-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-pixi.json
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Browser Smoke (Chromium Matrix)
    runs-on: ubuntu-latest
    needs: [web-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the current-build viewport suite against the shared artifact
        # This step is also the 320 CSS-pixel viewport gate for the Welcome
        # shell: `currentBuild.spec.ts` measures horizontal overflow at the
        # width plan section 10.1 names, at five subject-name lengths, and
        # measures every Welcome control against the 44 CSS-pixel minimum touch
        # target. It is a step in this job rather than a job or a lane of its
        # own for one reason: the artifact and the single Chromium install both
        # already exist here, so a second project, a second config, or a second
        # build would add cost and a second artifact to a run that has exactly
        # one. It gates, and the wiring gate
        # `tests/e2e/welcome-narrow-viewport.test.ts` asserts that it does.
        run: npm run test:e2e:recorded
      # Phase 9 Pixi world-host mount/unmount memory lane, as a step in this job.
      #
      # The same reasoning as the 320-pixel gate above - the browser and the preview
      # are already here, so a second job, a second install, or a second `npm ci` would
      # all be duplication - plus one thing this job could not have predicted: the
      # artifact under test is a *second*, flagged one, so it is downloaded here rather
      # than built, and only after the Phase 1 suite has run against the production
      # artifact above. Nothing before this step reads the replaced `dist`.
      #
      # It gates. Plan section 10.2's "no material canvas or GPU memory growth over 20
      # world mount and unmount cycles" had no browser evidence at all before this step
      # - `scripts/check-memory.mjs` states in its own output that it reads a build
      # rather than a browser - and a step that could not fail would leave the phase's
      # central memory criterion ungated. `tests/e2e/pixi-memory-lane.test.ts` asserts
      # that this step is not exempt and that no step in this job is; the wording here
      # avoids naming the exemption key, because the Phase 5 and Phase 6 wiring gates
      # assert on the raw text of a job whose comments are part of what they check.
      #
      # Evidence is the sanitized JSON the lane writes under the allowlisted
      # `artifacts/compatibility-evidence/` root, which the upload below takes and
      # nothing else. The lane records no trace, screenshot or video, and its own
      # results and HTML report directories are deliberately outside that
      # allowlist, so the pre-existing failure upload further down does not reach
      # them either.
      - name: Download the Pixi-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: pixi-web-artifact
          path: .
      - name: Verify the Pixi-flagged artifact identity
        run: npm run verify:web-artifact:pixi
      - name: Run the Pixi world mount/unmount memory lane
        run: npm run test:e2e:pixi-memory:recorded
      # The canvas-pointer lane, on the same flagged artifact, in this same job.
      #
      # A separate step rather than a ninth test in the memory spec: that spec's
      # `testMatch` is pinned to it and its eight-test count is asserted by
      # `tests/e2e/pixi-memory-lane.test.ts`, so widening it would break a gate that
      # works and would file this lane's evidence under the memory lane's name inside
      # the upload allowlist. It needs no second build, no second download and no
      # second browser install, because the artifact and the Chromium are both
      # already here.
      #
      # The step is not exempt from failing. A pointer press that changes the world
      # without changing the DOM mirror is invisible to every other gate in the
      # repository — a synthetic emitter call never enters the engine's event
      # system, a listener count is satisfied by a listener that never fires, and
      # the memory lane exercises the keyboard and the DOM control but never the
      # canvas — so this is the only thing that would catch it.
      - name: Run the Pixi canvas-pointer DOM mirror lane
        run: npm run test:e2e:pixi-pointer:recorded
      - name: Upload sanitized browser-smoke evidence
        # Allowlist: sanitized per-run JSON evidence only, on the same terms as the
        # storage-v2 and compatibility lanes. Nothing else leaves the runner, and
        # this lane's own two output directories are deliberately outside the
        # allowlisted root. `always()` because a red run is the run whose measurements
        # a reader most needs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            artifacts/playwright-report
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Phase 4 storage-v2 lane, and the Phase 5 fresh-profile restore lane.
  #
  # This is the ONE deliberately separate build in a complete CI run, and it is
  # not a second production artifact:
  #
  # - It builds with `VITE_STORAGE_REPOSITORY=v2` through `--mode storage-v2`,
  #   which reads `.env.storage-v2`. The production default stays
  #   `VITE_STORAGE_REPOSITORY=legacy`, so `web-build` above remains the single
  #   build, record, and upload point for the production `web-artifact`.
  # - The build is `build:storage-v2-data-products`, which is that same flagged
  #   build with one extra flag value, `VITE_DATA_PRODUCTS_V2=true`, in the
  #   environment. It is a strict superset, so one artifact serves both lanes and
  #   the artifact is still built exactly once. `VITE_STORAGE_REPOSITORY` still
  #   comes only from `.env.storage-v2`; see `scripts/build-flagged-data-products.mjs`
  #   for why the owner flag is set in the environment rather than in that file.
  # - It records its identity to its OWN manifest file
  #   (`artifacts/web-artifact-manifest-storage-v2.json`), so a flagged build can
  #   never be mistaken for, or overwrite, the shared production artifact
  #   identity, and `browser-smoke` and `compatibility-pr` are unaffected.
  # - That manifest also records a hash of the git-tracked source, so the four
  #   lanes below cannot certify a `dist` left over from an older source state.
  #   All four run in this one job against this one checkout, so the source
  #   identity is the same for the build, the record, and every lane, and no lane
  #   ever builds a second artifact to keep it that way.
  # - It runs one representative host only (Linux/Chromium). A real IndexedDB
  #   migration does not vary by engine the way rendering does, and keeping the
  #   lane to one cell is what stops a pull request from paying for eight
  #   browser installs. Cross-engine coverage of this spec stays a later,
  #   separately authorized release-candidate decision.
  # - It uploads only the allowlisted sanitized JSON evidence, never the
  #   Playwright HTML report, a trace, a screenshot, or test results.
  storage-v2-browser:
    name: Browser (Storage v2 Flagged Build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the flagged storage-v2 artifact with the Phase 5 products on
        run: npm run build:storage-v2-data-products
      - name: Record the flagged storage-v2 artifact identity
        run: npm run record:web-artifact:storage-v2
      - name: Verify the flagged storage-v2 artifact identity
        run: npm run verify:web-artifact:storage-v2
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the storage-v2 flagged-build lane
        run: npm run test:e2e:storage:recorded
      # Phase 5 fresh-profile restore lane.
      #
      # It is a *step in this job*, not a job of its own, for one reason: the
      # flagged artifact exists only here, and this job deliberately uploads
      # evidence only. A separate job would have to build the artifact a second
      # time, which is exactly the duplication this lane must avoid. Two steps keep
      # one build, one Chromium install, and one upload, and leave `web-build` as
      # the single production build, record, and upload point.
      #
      # The step gates. It gates because the product it exercises now exists and
      # the lane is the phase's acceptance evidence for the fresh-profile restore
      # deliverable; a `continue-on-error` here would turn a restore regression into
      # a green run. `tests/e2e/data-products-lane.test.ts` asserts the step does
      # NOT carry `continue-on-error`, so the exemption cannot creep back in.
      - name: Run the fresh-profile data-product restore lane
        run: npm run test:e2e:data-products:recorded
      # Phase 6 individual-subject backup lane.
      #
      # A third *step in this job*, for the same reason as the one above: the flagged
      # artifact with `VITE_DATA_PRODUCTS_V2=true` exists only here, this job uploads
      # evidence only and never `dist`, and a job of its own would have to build the
      # artifact a second time. One build, one Chromium install, one upload.
      #
      # It gates. `.kdsubject` had no browser evidence at all before this lane: the
      # only substrate for its central risk - a destructive or partial write against
      # a real device - was the `fake-indexeddb` shim. A restore or refusal regression
      # has to be a red run, so `tests/e2e/subject-product-lane.test.ts` asserts that
      # this step is not exempt from failing. The wording here deliberately avoids
      # naming the exemption key, because Phase 5's wiring gate asserts on the raw
      # text of this job and a comment that spelled it out would fail that gate.
      - name: Run the individual-subject backup lane
        run: npm run test:e2e:subject-product:recorded
      # Reload-persistence lane.
      #
      # A *fourth* step in this job, for the same reason as the ones above: the
      # flagged artifact with `VITE_DATA_PRODUCTS_V2=true` exists only here, this
      # job uploads evidence only and never the artifact itself, and a job of its
      # own would have to produce it a second time. One artifact, one Chromium
      # install, one upload.
      #
      # It gates, and the reason is sharper than for the three above: a
      # cross-phase data-loss defect shipped through two accepted phases because
      # every gate read the active generation directly - the write's destination,
      # and exactly the generation the next boot superseded. The only test that
      # could see it creates a subject through the application's own Welcome form,
      # performs each of the three product writes, reloads, and asserts the
      # subjects are still listed. `tests/e2e/reload-persistence-lane.test.ts`
      # asserts that this step's result is the job's result, so the exemption
      # cannot creep back in. The wording avoids naming that exemption key,
      # because the Phase 5 wiring gate asserts on the raw text of this job.
      - name: Run the reload-persistence lane
        run: npm run test:e2e:reload-persistence:recorded
      - name: Upload sanitized storage-v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only.
          name: storage-v2-evidence
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14

  compatibility-pr:
    name: Compatibility PR ${{ matrix.id }}
    needs: [web-build]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pr-linux-chromium
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-chromium
            expect_host: linux
            install_args: --with-deps
            install: chromium
          - id: pr-linux-firefox
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-firefox
            expect_host: linux
            install_args: --with-deps
            install: firefox
          - id: pr-macos-webkit
            lane: pull-request
            os: macos
            runs_on: macos-latest
            project: compat-webkit
            expect_host: macos
            install_args: ''
            install: webkit
          - id: pr-windows-edge
            lane: pull-request
            os: windows
            runs_on: windows-latest
            project: compat-edge
            expect_host: windows
            install_args: ''
            install: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - name: Install the lane browser
        run: npx playwright install ${{ matrix.install_args }} ${{ matrix.install }}
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the compatibility lane
        env:
          KD_COMPAT_EXPECT_HOST: ${{ matrix.expect_host }}
        run: npm run test:e2e:compat:recorded -- --project=${{ matrix.project }}
      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only. No Playwright HTML
          # report, trace, screenshot, or test-results directory is uploaded.
          name: compatibility-evidence-${{ matrix.id }}
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14
