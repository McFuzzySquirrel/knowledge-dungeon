name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (App, Node, Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Phase 8 CC0 media licensing gate.
  #
  # It gates, and it is a job of its own for one reason: it must be able to fail
  # before anything is built. The plan's Phase 8 exit criterion is that new media
  # cannot be added without CC0 metadata, and a criterion that is only checked
  # after `dist` exists has already let the artifact be built once. `web-build`
  # needs this job, so a registry without provenance, a checksum that does not
  # match the bytes on disk, an unregistered file, or an unverified asset in the
  # default PixiJS bundle stops the production artifact from being produced at all.
  #
  # There is deliberately no `npm ci` here. The checker imports nothing but Node
  # built-ins and reads only the repository, so this gate costs a checkout and a
  # Node setup, and it runs identically with or without a build. It also never
  # writes to `dist`, which keeps the run at exactly one production build.
  #
  # The step is not exempt from failing. `tests/phase8/license-gate-wiring.test.ts`
  # asserts that the job is bound, that the step runs the npm script, and that no
  # step in it carries a `continue-on-error`, so a regression to a warning cannot
  # land quietly. The wording above avoids naming that key on purpose, because that
  # same gate matches the key as a YAML key at the start of a line.
  asset-licenses:
    name: Asset Licenses (CC0 registry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify every public asset against the CC0 registry
        run: npm run test:licenses

  web-build:
    name: Web Build and Bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, asset-licenses]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # PHASE 23 CUTOVER. `npm run build:web` now builds the release artifact with the
      # post-cutover defaults: PixiJS, storage-v2 (legacy mirror writes retained), Cozy
      # visuals, data products, Gentle assistance, Web Share, the redesigned workspaces,
      # and the offline shell are all on. Every corresponding VITE_* flag is retained as a
      # documented one-release rollback. The immediate full-rollback configuration is:
      #
      #   VITE_WORLD_RENDERER=phaser VITE_STORAGE_REPOSITORY=legacy npm run build:web
      #
      # with `VITE_PIXI_VILLAGE=false`, `VITE_PIXI_DUNGEON=false`, `VITE_PIXI_FISHING=false`,
      # `VITE_COZY_VISUALS=false`, `VITE_ADAPTIVE_ASSISTANCE=false`,
      # `VITE_DATA_PRODUCTS_V2=false`, `VITE_WEB_SHARE=false`, the three workspace flags
      # false, and `VITE_OFFLINE_SHELL=false` added as needed. No workflow pins a
      # pre-cutover default; the flagged build steps below set a flag explicitly to pin a
      # lane's recorded identity, not to override a differing production default.
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npm run check:bundle-size
      # Phase 9 renderer memory preflight.
      #
      # A step in this job rather than a job of its own, for the same reason as the
      # Welcome budget below: `dist` exists here and nowhere else, and the script
      # imports only Node built-ins, so it needs no install of its own.
      #
      # It is the deterministic half of plan section 10.2's renderer memory gate. It
      # reads the built artifact - it never starts a browser, never mounts a world,
      # and never claims a mount/unmount measurement. What it does establish is that
      # the entry document does not name a Pixi chunk (an eager renderer load on
      # Welcome), that every renderer chunk is within plan section 10.2's 800 KiB
      # gzip ceiling for any lazy JavaScript chunk, and that the run measured a
      # renderer at all. A missing `dist` fails rather than passing an unmeasured
      # build. The browser-backed half - 20 mount/unmount cycles, canvas count, GPU
      # memory - needs a Playwright lane and is not claimed here.
      #
      # The step is not exempt from failing. `tests/phase9/memory-gate-wiring.test.ts`
      # asserts that, so a regression to a warning cannot land quietly. The wording
      # above avoids naming that key on purpose, because that same gate matches the
      # key as a YAML key at the start of a line.
      - name: Enforce the renderer memory preflight on the built artifact
        run: npm run check:memory
      # Plan section 10.2's Welcome budget: 300 KiB gzip for initial JavaScript and
      # CSS, excluding lazy renderer bundles. It is a step in this job rather than a
      # job or a lane of its own because `dist` exists here and nowhere else, and it
      # reads the same `dist` the one `build:web` above just produced - a second build
      # would defeat the only property that makes this measurement meaningful, which
      # is that it describes the artifact that is about to be uploaded. The script
      # also needs no `npm ci` beyond what this job already installs, because it imports
      # only Node built-ins.
      #
      # The step is not exempt from failing.
      # `tests/phase8/welcome-budget-gate.test.ts` asserts that, so a regression to a
      # warning cannot land quietly and a growing Welcome shell cannot ship behind a
      # green run. The wording above avoids naming that key on purpose, because that
      # same gate matches the key as a YAML key at the start of a line.
      - name: Enforce the Welcome initial payload budget
        run: npm run check:budget:welcome
      # Phase 22 route-aware budgets: each declared lazy boundary (the renderer
      # families and the assistance/share/offline feature lanes) at or under 800 KiB
      # gzip, and the raw `dist` at or under 12 MB. It is a step in this job for the
      # same reason as the two above - `dist` and its `bundle-census.json` exist here
      # and nowhere else, and both are read from the one build that is about to be
      # uploaded. The 300 KiB Welcome budget is not re-checked here; the step above
      # owns it and remains its only declaration.
      #
      # The step is not exempt from failing.
      # `tests/performance/performance-wiring.test.ts` asserts that, so a regression
      # to a warning cannot land quietly. The wording above avoids naming that key on
      # purpose, because that same gate matches the key as a YAML key at the start of
      # a line.
      - name: Enforce the route-aware performance budgets on the built artifact
        run: npm run check:perf
      - run: npm run record:build-metadata
      # The manifest carries two identities: the `dist` tree hash, and a hash of
      # the git-tracked source the artifact was recorded against. The tree hash
      # alone is self-referential - it is recorded from the same `dist` it later
      # describes - so a stale `dist` paired with a manifest recorded from that
      # same stale tree matched byte for byte. The source identity is what makes
      # that pairing fail. Recording and verifying in one job, on one checkout, is
      # what keeps the two satisfiable here and in every consuming job below.
      - name: Record the shared production artifact identity
        run: npm run record:web-artifact
      - name: Verify the shared production artifact identity
        run: npm run verify:web-artifact
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: web-build-metadata
          path: artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the shared production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14
      # Phase 9 Pixi-flagged build lane.
      #
      # Plan section 11 requires Pixi paths to "run in CI and internal builds" before
      # cutover, and `VITE_WORLD_RENDERER` is a build-time flag, so the only way to
      # exercise it is to build with it. This is deliberately *steps in this job* and
      # not a job of its own, for the same reason the four flagged lanes are steps in
      # the storage-v2 job: one job means one `npm ci`, and the run stays at one
      # production build, one recorded artifact identity, and one upload.
      #
      # Three properties keep this from disturbing the release:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified,
      #   and uploaded. Nothing downstream reads this job's `dist` - `browser-smoke`
      #   and the four compatibility lanes download the uploaded `web-artifact`, not
      #   this runner's working directory - so the rebuild cannot be mistaken for the
      #   artifact that shipped.
      # - It records and uploads no second *production* artifact. After the Phase 23
      #   cutover the production default is `VITE_WORLD_RENDERER=pixi`; this build pins
      #   the flag explicitly so the lane's identity is recorded rather than inherited,
      #   and it exists to be measured and then discarded. The one thing it does upload
      #   is the flagged build's own identity, to its own manifest, and only because
      #   the browser-backed lane below measures it from a different job.
      # - It installs no browser. The renderer switch is exercised at build level
      #   here, so a pull request does not pay for a browser install to prove that a
      #   flag compiles into a working artifact. The browser-backed half of the same
      #   memory criterion is a separately gated lane, in a job that already has a
      #   browser, and is not something this step quietly becomes.
      #
      # `vite.config.ts` also enforces the lazy-chunk boundary inside every build, so
      # a Pixi build that statically reached the Pixi runtime would already have
      # failed the two steps above it rather than being measured here.
      - name: Build the Phase 9 Pixi-flagged artifact
        run: npm run build:web:pixi
      - run: npm run check:bundle-size
      - name: Enforce the renderer memory preflight on the Pixi-flagged artifact
        run: npm run check:memory
      # Phase 22 route-aware budgets on the Pixi-flagged artifact. The `vendor-pixi-*`
      # boundary is absent from the default build, so this is the only step that
      # measures it; the `renderer:pixi` boundary line in the default run reads
      # "NOT PRESENT in this build (not measured)" by design.
      - name: Enforce the route-aware performance budgets on the Pixi-flagged artifact
        run: npm run check:perf
      # The browser-backed half of the same criterion, and the only thing this job
      # uploads besides the release artifact.
      #
      # `tests/phase9/memory-gate-wiring.test.ts` records this job's contract: the
      # Pixi build is a *build-level* lane, it "does not quietly become a browser
      # lane", and this job must install no browser at all. That contract is honoured
      # here - this job still installs none - and the browser-backed half runs in
      # `browser-smoke`, which already has one. That is the only lawful placement
      # left, and the reason is worth stating rather than working around:
      #
      # - the Pixi-flagged artifact can only be produced here, because eleven existing
      #   wiring gates assert that no other CI job runs any `build:web*` script;
      # - the `storage-v2-browser` job cannot receive it, because its own gate asserts
      #   that job neither downloads an artifact nor runs a `build:web*` script;
      # - `browser-smoke` already downloads an artifact, verifies it, installs one
      #   browser, and previews a `dist`, so a second artifact costs one upload and
      #   one download and no new job, no new `npm ci`, and no new browser install.
      #
      # The wording of this block deliberately avoids naming the tool whose absence
      # the gate above asserts on, because that gate matches the phrase anywhere in
      # this job's text - comments included - and a comment that spelled it out would
      # fail it. The same reason keeps the tool's name out of the steps it describes.
      #
      # The upload is the Pixi build's *own* identity, to its own manifest, so it can
      # never be mistaken for the release artifact; the lane verifies that manifest
      # before it measures anything, and `browser-smoke` runs its production suite
      # against the production artifact before this download replaces `dist`.
      - name: Record the Pixi-flagged artifact identity
        run: npm run record:web-artifact:pixi
      - name: Verify the Pixi-flagged artifact identity
        run: npm run verify:web-artifact:pixi
      - name: Upload the Pixi-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixi-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-pixi.json
          if-no-files-found: error
          retention-days: 14
      # Phase 17 Pixi-fishing-flagged artifact, and the third artifact this
      # run produces.
      #
      # `VITE_PIXI_FISHING` is a build-time flag like the two above, so the only
      # way to exercise the flagged pond is to build with it — and Phase 17's
      # exit criterion ("a complete cast-to-catch-to keep flow works using touch
      # and keyboard") had no browser evidence in CI at all before this step.
      # Its own Verification block says `VITE_PIXI_FISHING=true npm run
      # test:e2e`, and `test:e2e` builds and previews the **default** artifact,
      # so that command measured the Phaser fishing lane rather than the Pixi
      # one. This is the lane that measures the right bytes.
      #
      # It is *steps in this job* rather than a job of its own for exactly the
      # reasons the two flagged lanes above state, and the repository's gates
      # force that shape: eleven wiring gates assert that no job other than
      # `web-build` runs any `build:web*` script, and the two browser lanes that
      # exist (`browser-smoke`, and `storage-v2-browser`) are each already
      # asserted to neither download an artifact nor keep a `dist` of its own.
      # A job of this lane's own would have to build a second artifact.
      #
      # Three properties keep it from disturbing the release, and they are the
      # three the Pixi block above already has:
      #
      # - It runs strictly AFTER the production artifact has been recorded,
      #   verified and uploaded. Nothing downstream reads this runner's
      #   `dist` — the browser jobs download the uploaded artifacts — so this
      #   rebuild cannot be mistaken for the artifact that shipped.
      # - It records and uploads no second **production** artifact. After the
      #   Phase 23 cutover the production default is `VITE_WORLD_RENDERER=pixi`
      #   and `VITE_PIXI_FISHING=true`; this build pins both explicitly so the
      #   lane's identity is recorded rather than inherited, and it exists to be
      #   measured and then discarded. Its identity goes to its OWN manifest,
      #   and `vite.config.ts` already refuses to emit a build in which the
      #   flag is on and the pond chunk is missing, so a silently dropped flag
      #   fails the build step rather than the lane four minutes later.
      # - It installs no browser, exactly like the build job's other two
      #   flagged builds. The browser-backed half runs in `browser-smoke`, which
      #   already installs one Chromium and previews one `dist`.
      #
      # The bundle check runs against this artifact for the same reason it runs
      # against the Pixi one: the pond is a lazy chunk the release path does not
      # ship, and a chunk that arrives oversized has to fail in the job that
      # produced it rather than in whichever lane happens to look at it first.
      - name: Build the Phase 17 Pixi-fishing-flagged artifact
        run: npm run build:web:pixi-fishing
      - run: npm run check:bundle-size
      - name: Record the Pixi-fishing-flagged artifact identity
        run: npm run record:web-artifact:pixi-fishing
      - name: Verify the Pixi-fishing-flagged artifact identity
        run: npm run verify:web-artifact:pixi-fishing
      - name: Upload the Pixi-fishing-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixi-fishing-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-pixi-fishing.json
          if-no-files-found: error
          retention-days: 14
      # Phase 19 assistance-flagged artifact, and the fourth artifact this run produces.
      #
      # `VITE_ADAPTIVE_ASSISTANCE` is a build-time flag like the three above, and its browser lane
      # had **no** artifact until this step - Phase 19 deferred it to Phase 21 on 2026-10-05 and
      # authorised it on 2026-10-06, on the grounds that Phase 21 runs the accessibility audit
      # anyway. Every property here is the one the three blocks above already have:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified and uploaded.
      #   Nothing downstream reads this runner's `dist` - the browser jobs download the uploaded
      #   artifacts - so this rebuild cannot be mistaken for the artifact that shipped.
      # - It records and uploads no second **production** artifact. After the Phase 23
      #   cutover the production default is `VITE_ADAPTIVE_ASSISTANCE=true`, so this step pins
      #   the flag explicitly to record the lane's identity; it exists to be measured and then
      #   discarded, and its
      #   identity goes to its OWN manifest, so it can never overwrite the release identity.
      # - It installs no browser, exactly like the build job's other three flagged builds.
      #
      # `vite.config.ts` already refuses to emit a build whose assistance lane modules are not
      # fetchable, so a dropped flag fails this step rather than producing a lane that verifies
      # nothing - and `scripts/require-assistance-lane-artifact.mjs` reads the compiled flag constant
      # out of the emitted bytes before Playwright starts, which is the check that would catch a
      # lane pointed at the wrong `dist`.
      - name: Build the Phase 19 assistance-flagged artifact
        run: npm run build:web:assistance
      - run: npm run check:bundle-size
      - name: Record the assistance-flagged artifact identity
        run: npm run record:web-artifact:assistance
      - name: Verify the assistance-flagged artifact identity
        run: npm run verify:web-artifact:assistance
      - name: Upload the assistance-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: assistance-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-assistance.json
          if-no-files-found: error
          retention-days: 14
      # Phase 22 offline-shell-flagged artifact, and the fifth flagged artifact this
      # run produces.
      #
      # `VITE_OFFLINE_SHELL` is a build-time flag like the four above, and the worker,
      # the shell manifest, and the web app manifest only exist in a build made with
      # it on. Two browser lanes measure that build - the offline reload lane and the
      # service-worker-enabled compatibility lane - and neither can build it for
      # itself, because eleven existing gates assert that no job other than
      # `web-build` runs any `build:web*` script.
      #
      # Every property here is the one the four blocks above already have:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified
      #   and uploaded. Nothing downstream reads this runner's `dist` - the browser
      #   jobs download the uploaded artifacts - so this rebuild cannot be mistaken
      #   for the artifact that shipped.
      # - It records and uploads no second **production** artifact. After the Phase 23
      #   cutover the production default is `VITE_OFFLINE_SHELL=true`; this step pins the
      #   flag explicitly to record the lane's identity, and it exists to be measured and
      #   then discarded, with its identity going to its OWN manifest.
      # - It installs no browser, exactly like the build job's other four flagged
      #   builds. The browser-backed half runs in `browser-smoke`.
      #
      # `scripts/require-offline-lane-artifact.mjs` reads the emitted `sw.js` and
      # `offline-shell-manifest.js` out of `dist/` before either browser lane starts,
      # which is the check that would catch a lane pointed at the wrong `dist` or a
      # build that silently dropped the flag.
      - name: Build the Phase 22 offline-shell-flagged artifact
        run: npm run build:web:offline
      - run: npm run check:bundle-size
      # Phase 22 route-aware budgets on the offline-shell-flagged artifact. The
      # `lane:offline` boundary (the service worker and its precache manifest) is
      # absent from the default build, so this step is where it is measured.
      - name: Enforce the route-aware performance budgets on the offline-shell artifact
        run: npm run check:perf
      - name: Record the offline-shell-flagged artifact identity
        run: npm run record:web-artifact:offline
      - name: Verify the offline-shell-flagged artifact identity
        run: npm run verify:web-artifact:offline
      - name: Upload the offline-shell-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-shell-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-offline.json
          if-no-files-found: error
          retention-days: 14
      # Phase 22 Pixi-dungeon performance fixture artifact, and the sixth flagged
      # artifact this run produces.
      #
      # `VITE_PIXI_DUNGEON` is a build-time flag like the five above, and the PixiJS
      # dungeon world only exists in a build made with it on. The frame-time lane
      # measures that world in a browser, so it needs an artifact that a browser job can
      # download; the Phase 9 `pixi-web-artifact` cannot serve, because
      # `VITE_WORLD_RENDERER=pixi` routes the world screen to the Phase 9 test host
      # rather than to `GameScreen`.
      #
      # Every property here is the one the five blocks above already have:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified
      #   and uploaded. Nothing downstream reads this runner's `dist` - the browser jobs
      #   download the uploaded artifacts - so this rebuild cannot be mistaken for the
      #   artifact that shipped.
      # - It records and uploads no second **production** artifact. After the Phase 23
      #   cutover the production default is `VITE_PIXI_DUNGEON=true`; this step pins the
      #   flag explicitly to record the lane's identity, and it exists to be measured and
      #   then discarded, with its identity going to its OWN manifest.
      # - It installs no browser, exactly like the build job's other five flagged
      #   builds. The browser-backed half runs in `browser-smoke`.
      #
      # `vite.config.ts` already refuses to emit a build that asked for the dungeon and
      # carries no Pixi chunk, so a dropped flag fails this step rather than producing a
      # lane that verifies nothing - and `scripts/require-pixi-perf-lane-artifact.mjs`
      # reads the emitted bundle census before Playwright starts, which is the check that
      # would catch a lane pointed at the wrong `dist`.
      - name: Build the Phase 22 Pixi-dungeon performance fixture artifact
        run: npm run build:web:pixi-dungeon
      - run: npm run check:bundle-size
      - name: Record the Pixi-dungeon-flagged artifact identity
        run: npm run record:web-artifact:pixi-dungeon
      - name: Verify the Pixi-dungeon-flagged artifact identity
        run: npm run verify:web-artifact:pixi-dungeon
      - name: Upload the Pixi-dungeon-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixi-dungeon-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-pixi-dungeon.json
          if-no-files-found: error
          retention-days: 14
      # Phase 22 route-change teardown artifact, and the seventh flagged artifact this
      # run produces.
      #
      # The Phase 22 route lane drives a real route change from the PixiJS dungeon to
      # the village and the PixiJS fishing pond, so it needs ONE artifact that carries
      # both Pixi worlds at once. No existing artifact does: `build:web:pixi-dungeon`
      # sets only `VITE_PIXI_DUNGEON` - which `tests/phase13/dungeon-flag-boundary.test.ts`
      # asserts as "the dungeon flag and nothing else" - so it carries no pond, and no
      # single-flag build has both. Fetching two artifacts and merging them would make a
      # tree that is neither build, which is the exact defect the discards below exist to
      # prevent. `VITE_PIXI_VILLAGE` is deliberately left off: the lane's route walks
      # THROUGH the Phaser village, and that is what makes the dungeon a screen-route
      # teardown rather than a village-internal one, so an all-worlds build would change
      # what the lane measures rather than broaden it.
      #
      # Every property here is the one the six blocks above already have:
      #
      # - It runs strictly AFTER the production artifact has been recorded, verified and
      #   uploaded. Nothing downstream reads this runner's `dist` - the browser jobs
      #   download the uploaded artifacts - so this rebuild cannot be mistaken for the
      #   artifact that shipped.
      # - It records and uploads no second **production** artifact. After the Phase 23
      #   cutover the production default is `VITE_PIXI_DUNGEON=true` and
      #   `VITE_PIXI_FISHING=true`; this step pins both explicitly to record the lane's
      #   identity, and it exists to be measured and then discarded, with its identity
      #   going to its OWN manifest.
      # - It installs no browser, exactly like the build job's other six flagged builds.
      #   The browser-backed half runs in `browser-smoke`.
      #
      # `vite.config.ts` refuses to emit a build that asked for a world and carries no
      # Pixi chunk for it, so a dropped flag fails this step rather than producing a lane
      # that verifies nothing - and `check:bundle-size` runs here so an oversized route
      # chunk fails in the job that produced it rather than in the lane.
      - name: Build the Phase 22 Pixi-route-flagged artifact
        run: npm run build:web:pixi-route
      - run: npm run check:bundle-size
      - name: Record the Pixi-route-flagged artifact identity
        run: npm run record:web-artifact:pixi-route
      - name: Verify the Pixi-route-flagged artifact identity
        run: npm run verify:web-artifact:pixi-route
      - name: Upload the Pixi-route-flagged web artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixi-route-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-pixi-route.json
          if-no-files-found: error
          retention-days: 14
      # Phase 23 full-rollback artifact, and the last artifact this run produces.
      #
      # `scripts/build-rollback.mjs` forces every cutover flag to its pre-cutover value, so
      # this is the only artifact in which the assistance feature is genuinely absent: the
      # cutover production build now includes it, and the Phase 19 absence lane can only
      # make its claim about absence against a tree where the flag is off. It is built,
      # bundled-checked, recorded, verified and uploaded here exactly like the flagged
      # artifacts above, and only after the production artifact has been recorded and
      # uploaded, so it can never be mistaken for the release identity.
      - name: Build the Phase 23 rollback artifact
        run: npm run build:web:rollback
      - run: npm run check:bundle-size
      - name: Record the rollback artifact identity
        run: npm run record:web-artifact:rollback
      - name: Verify the rollback artifact identity
        run: npm run verify:web-artifact:rollback
      - name: Upload the rollback web artifact
        uses: actions/upload-artifact@v4
        with:
          name: rollback-web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest-rollback.json
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Browser Smoke (Chromium Matrix)
    runs-on: ubuntu-latest
    needs: [web-build]
    # Raised from 20 when the Phase 10 lane became a third browser suite in this
    # job, and the reason is about evidence rather than about the new step's own
    # cost. A job-level timeout cancels the job, and it cancels it *after* the two
    # lanes that already ran and after the evidence step that is otherwise
    # unconditional, so a ceiling that the new step can reach would destroy the
    # Pixi lanes' measurements too - a slower lane turning a reportable red test
    # into a lost run. The Phase 10 lane's per-test ceiling is three times this
    # job's other lanes', because its accessibility scan boots the Phaser world and
    # runs two axe analyses at four viewports, and that margin is what pays for it.
    # Measured locally end to end at 80 seconds including the artifact preflight
    # and verification, on a machine faster than a two-core runner.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the current-build viewport suite against the shared artifact
        # This step is also the 320 CSS-pixel viewport gate for the Welcome
        # shell: `currentBuild.spec.ts` measures horizontal overflow at the
        # width plan section 10.1 names, at five subject-name lengths, and
        # measures every Welcome control against the 44 CSS-pixel minimum touch
        # target. It is a step in this job rather than a job or a lane of its
        # own for one reason: the artifact and the single Chromium install both
        # already exist here, so a second project, a second config, or a second
        # build would add cost and a second artifact to a run that has exactly
        # one. It gates, and the wiring gate
        # `tests/e2e/welcome-narrow-viewport.test.ts` asserts that it does.
        run: npm run test:e2e:recorded
      # Phase 10 audio and asset lane, as a step in this job, and *before* the
      # flagged download below rather than after it.
      #
      # `browser-smoke` is the only lawful job, and not only for the reason the two
      # Pixi lanes above already give. This job installs exactly one Chromium and
      # runs `npm ci` exactly once, and the existing wiring gates assert that no
      # job other than `web-build` runs any `build:web*` script - so a job of this
      # lane's own would have to either build a second artifact or download a
      # second one, and the two artifact downloads already in this job are counted
      # and pinned, so a third would break a gate that is currently working. The
      # artifact this lane measures is the *production* one, which is the artifact
      # this job already downloaded and already verified above.
      #
      # The placement *within* the job is forced, and it is the mirror of the Pixi
      # lanes' placement. This lane previews the production artifact deliberately:
      # the audio service has no engine import at all and the asset runtime is
      # reached by importing the module under test rather than by mounting a route,
      # so the production build is the one whose privacy, persistence and
      # accessibility claims are worth making - `tests/e2e/phase10-media-lane.ts`
      # records that choice and its boundaries. The two steps below deliberately
      # clear this job's production tree and replace it with the flagged build, so
      # a step placed after them would preview a Pixi-flagged tree while its own
      # preflight and its first test verified the production identity: a green run
      # describing something other than what it claims, which is the same shape of
      # defect the clear step below exists to prevent. The Phase 9 pointer wiring
      # gate independently requires that nothing at all run between the clear and
      # the download, and this step sits before the clear for that reason as well.
      #
      # It gates. The gesture check, the settings-persistence check, the
      # no-off-origin-request check and the four-viewport accessibility scan had no
      # browser evidence in CI at all before this step, and the Phase 9 record is
      # the reason that matters: three of that phase's four shipped defects were
      # found by CI and by nothing else. A lane that only ever runs locally is the
      # gap this closes. The step is not exempt from failing, and no step in this
      # job is; the wording here avoids naming the exemption key, because several
      # wiring gates assert on the raw text of a job whose comments are part of what
      # they check.
      #
      # Evidence is the same sanitized JSON the allowlisted upload below already
      # takes, written under `artifacts/compatibility-evidence/`. The lane records
      # no trace, screenshot or video, and its own results directory sits
      # deliberately outside that allowlisted root, so the pre-existing failure
      # upload further down does not reach it either. It adds a step and nothing
      # else: no build, no download, no browser install, no second `npm ci`.
      - name: Run the Phase 10 audio and asset lane
        run: npm run test:e2e:phase10-media:recorded
      # Phase 9 Pixi world-host mount/unmount memory lane, as a step in this job.
      #
      # The same reasoning as the 320-pixel gate above - the browser and the preview
      # are already here, so a second job, a second install, or a second `npm ci` would
      # all be duplication - plus one thing this job could not have predicted: the
      # artifact under test is a *second*, flagged one, so it is downloaded here rather
      # than built, and only after the Phase 1 suite has run against the production
      # artifact above. Nothing before this step reads the replaced `dist`.
      #
      # It gates. Plan section 10.2's "no material canvas or GPU memory growth over 20
      # world mount and unmount cycles" had no browser evidence at all before this step
      # - `scripts/check-memory.mjs` states in its own output that it reads a build
      # rather than a browser - and a step that could not fail would leave the phase's
      # central memory criterion ungated. `tests/e2e/pixi-memory-lane.test.ts` asserts
      # that this step is not exempt and that no step in this job is; the wording here
      # avoids naming the exemption key, because the Phase 5 and Phase 6 wiring gates
      # assert on the raw text of a job whose comments are part of what they check.
      #
      # Evidence is the sanitized JSON the lane writes under the allowlisted
      # `artifacts/compatibility-evidence/` root, which the upload below takes and
      # nothing else. The lane records no trace, screenshot or video, and its own
      # results and HTML report directories are deliberately outside that
      # allowlist, so the pre-existing failure upload further down does not reach
      # them either.
      - name: Discard the production dist before the flagged download
        # `actions/download-artifact` extracts *into* the working directory, so a
        # second download merges into the tree the first one left behind rather than
        # replacing it. The two builds emit the same logical chunk names with
        # different content hashes, so the merged tree is neither artifact: it was
        # 179 files, the union of a 151-file production dist and the flagged one.
        #
        # The identity check caught it, which is the right place for it to be caught:
        # `dist-does-not-match-recorded-artifact`, before anything was measured. But a
        # red run is a worse outcome than a correct one, so the tree is replaced
        # explicitly. This is the mirror of the invariant the build job already
        # asserts — that nothing between the production upload and the Pixi build
        # *reads* `dist`. This one is that nothing between the production suite and
        # the Pixi download *keeps* it.
        run: rm -rf dist
      - name: Download the Pixi-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: pixi-web-artifact
          path: .
      - name: Verify the Pixi-flagged artifact identity
        run: npm run verify:web-artifact:pixi
      - name: Run the Pixi world mount/unmount memory lane
        run: npm run test:e2e:pixi-memory:recorded
      # The canvas-pointer lane, on the same flagged artifact, in this same job.
      #
      # A separate step rather than a ninth test in the memory spec: that spec's
      # `testMatch` is pinned to it and its eight-test count is asserted by
      # `tests/e2e/pixi-memory-lane.test.ts`, so widening it would break a gate that
      # works and would file this lane's evidence under the memory lane's name inside
      # the upload allowlist. It needs no second build, no second download and no
      # second browser install, because the artifact and the Chromium are both
      # already here.
      #
      # The step is not exempt from failing. A pointer press that changes the world
      # without changing the DOM mirror is invisible to every other gate in the
      # repository — a synthetic emitter call never enters the engine's event
      # system, a listener count is satisfied by a listener that never fires, and
      # the memory lane exercises the keyboard and the DOM control but never the
      # canvas — so this is the only thing that would catch it.
      - name: Run the Pixi canvas-pointer DOM mirror lane
        run: npm run test:e2e:pixi-pointer:recorded
      # Phase 17 fishing lane, on the third artifact, in this same job.
      #
      # It needs a *second* flagged artifact, so it is downloaded here rather
      # than built, and the download is preceded by its own discard for exactly
      # the reason the first one exists: `actions/download-artifact` extracts
      # **into** the working directory, so a third download merged into the tree
      # the second one left behind would be a union of two flagged builds that is
      # neither of them. The identity check would catch that, and a red run is a
      # worse outcome than a correct one, so the tree is replaced explicitly.
      #
      # The ordering is load-bearing and is asserted in three separate wiring
      # gates rather than described here alone: nothing may run between the
      # discard and the download that puts a `dist` back, the lane must run after
      # the download **and** after the identity check so it cannot measure a
      # stale artifact, and the two Pixi lanes above must have finished against
      # the artifact they were given. This block is last for that reason, and a
      # lane appended to it is one more thing for those gates to keep ordering.
      #
      # It gates. Phase 17's exit criterion had no browser evidence in CI at all
      # before this step, and a step that could not fail would leave the phase's
      # central criterion ungated. The step is not exempt from failing and no
      # step in this job is. It adds four steps and nothing else: no build, no
      # browser install, no second `npm ci`.
      #
      # Evidence is the same sanitized JSON the allowlisted upload above already
      # takes — the lane writes under `artifacts/compatibility-evidence/` — and it
      # records no trace, screenshot or video, so the pre-existing failure upload
      # further down is the only other thing that could carry one and it names
      # neither of this lane's output directories.
      - name: Discard the Pixi-flagged dist before the fishing download
        run: rm -rf dist
      - name: Download the Pixi-fishing-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: pixi-fishing-web-artifact
          path: .
      - name: Verify the Pixi-fishing-flagged artifact identity
        run: npm run verify:web-artifact:pixi-fishing
      - name: Run the Pixi fishing lane
        run: npm run test:e2e:fishing:recorded
      # Phase 19 assistance lane, on a fourth flagged artifact, in this same job.
      #
      # It needs a *third* flagged artifact, so it is fetched here rather than built, and the
      # fetch is preceded by its own discard for exactly the reason the two above exist: the
      # download action extracts **into** the working directory, so a fourth fetch merged into the
      # tree the third left behind would be a union of two flagged builds that is neither of them.
      # The identity check would catch it, and a red run is a worse outcome than a correct one, so
      # the tree is replaced explicitly.
      #
      # Two lanes and two steps, not one, because a lane that proves presence and a lane that
      # proves absence are separate claims about separate artifacts and a test's premise must be
      # true of the artifact it runs against. The flagged lane observes a real suggestion card -
      # the first browser evidence Phase 19's learner-facing half ever had - and the default lane
      # drives the identical journey and observes nothing, which is what makes the first one a
      # statement about a gate rather than about a card that is always on screen.
      #
      # The step is not exempt from failing. A lane that reported green while observing nothing would
      # be the Phase 17 dead lane in new clothing, and `scripts/require-assistance-lane-artifact.mjs`
      # exists to stop it before Playwright starts. The wording of this block deliberately avoids
      # naming the exemption key, because several wiring gates assert on the raw text of this job -
      # and it equally deliberately avoids the literal names of the download and browser-install
      # actions, because `tests/e2e/fishing-lane.test.ts` slices a step's block **including the
      # comments above it** and then asserts that the Phase 17 lane's own step contains neither.
      # A comment naming those actions inside a neighbouring step's slice reads as a violation.
      - name: Discard the fishing dist before the assistance download
        run: rm -rf dist
      - name: Download the assistance-flagged web artifact
        uses: actions/download-artifact@v4
        with:
          name: assistance-web-artifact
          path: .
      - name: Verify the assistance-flagged artifact identity
        run: npm run verify:web-artifact:assistance
      - name: Run the flagged assistance lane
        run: npm run test:e2e:assistance:recorded
      - name: Discard the assistance dist before the rollback download
        # The mirror image, and the half that cannot be inferred. After the Phase 23 cutover
        # the **production** artifact includes the assistance feature, so this absence lane
        # previews the **rollback** artifact instead - the one tree in which the flag is
        # genuinely off - and verifies that identity before it runs. A lane claiming "the card
        # is absent" while pointed at the cutover production build, or at a flagged build,
        # would describe something other than what it claims, which is the same shape of
        # defect the discards above exist to prevent.
        run: rm -rf dist
      - name: Download the rollback artifact for the absence lane
        uses: actions/download-artifact@v4
        with:
          name: rollback-web-artifact
          path: .
      - name: Verify the rollback artifact identity
        run: npm run verify:web-artifact:rollback
      - name: Run the default-artifact assistance lane
        run: npm run test:e2e:assistance:default:recorded
      - name: Discard the rollback dist before the production re-download
        # The accessibility audit below still describes **what ships**, so the cutover
        # production tree is downloaded back and re-verified after the rollback lane: the
        # rollback lane leaves a tree whose worlds fall back to Phaser, which is not the
        # artifact the audit is meant to certify.
        run: rm -rf dist
      - name: Download the shared production artifact for the accessibility audit
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the production artifact identity before the accessibility audit
        run: npm run verify:web-artifact
      # Phase 21 automated accessibility suite.
      #
      # Placed here because the artifact and the single Chromium install both already exist, so a
      # job of its own would add cost, a second `npm ci`, and a second production build for no new
      # evidence. It runs the **`runnable` scope**, not the plan's `host` scope and not `matrix`:
      # "everything this runner could have done on this host, it did, and it passed". That is the
      # only claim a single-OS job can honestly make, and the runner prints every cell it could not
      # run together with the reason - `compat-webkit` is macOS-only, `compat-edge` is Windows-only -
      # so the coverage block in this job's log is not a partial matrix presented as a complete one.
      #
      # `test:a11y:complete` is deliberately NOT wired here. It exits 3 on a single-host runner by
      # construction, because the five manual physical-device gates - ChromeVox, a physical
      # Chromebook, a touch-platform screen reader, a real macOS Safari, a real desktop profile - need
      # hardware no runner has. A permanently-red PR gate carries no information, which is the same
      # failure as a permanently-green one. The complete-matrix gate is the phase exit criterion and
      # is run per host by a person, with the absences in its output.
      #
      # It gates. `tests/phase21/infraA11ySuite.test.ts` asserts that this step is not exempt from
      # failing and that no CI step runs the complete scope, so a regression to a warning cannot
      # land quietly. The wording avoids naming the exemption key, because several wiring gates
      # assert on the raw text of this job whose comments are part of what they check.
      - name: Run the Phase 21 automated accessibility audit
        run: npm run test:a11y:runnable
      # Phase 22 offline-shell-flagged artifact, downloaded here and measured by two
      # lanes in this job.
      #
      # `web-build` builds, records, verifies and uploads it once; this job downloads
      # it once and both the service-worker compatibility lane and the offline reload
      # lane run against that one download. The download is preceded by its own
      # discard for the same reason the four above are: `actions/download-artifact`
      # extracts **into** the working directory, so a further download merged into the
      # tree the accessibility audit's production re-download left behind would be a
      # union of two builds that is neither of them.
      #
      # The two lanes run in the order below on purpose. The compatibility lane is
      # read-only; the offline lane's version-bump step rewrites
      # `dist/offline-shell-manifest.js` and its `afterAll` regenerates the default
      # token, but the compatibility lane must never measure a tree the offline lane
      # has just touched, so the pure lane runs first.
      #
      # Both steps gate. Neither is exempt from failing, and no step in this job is;
      # the wording here avoids naming the exemption key, because several wiring gates
      # assert on the raw text of a job whose comments are part of what they check.
      #
      # Evidence is the same sanitized JSON the allowlisted upload below already
      # takes: the compatibility lane writes under
      # `artifacts/compatibility-evidence/`, and both lanes record no trace,
      # screenshot, or video.
      - name: Discard the production dist before the offline-shell download
        run: rm -rf dist
      - name: Download the offline-shell-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: offline-shell-web-artifact
          path: .
      - name: Verify the offline-shell-flagged artifact identity
        run: npm run verify:web-artifact:offline
      - name: Run the Phase 22 service-worker compatibility lane
        run: npm run test:e2e:sw-shell:recorded
      - name: Run the Phase 22 offline-shell lane
        run: npm run test:e2e:offline:recorded
      # Phase 22 Pixi-dungeon frame-time lane, on the sixth flagged artifact, in this
      # same job.
      #
      # The artifact is built, recorded, verified and uploaded once by `web-build` and
      # fetched here, for the same reason the four flagged lanes above are: the browser
      # and the single Chromium install already exist in this job, and eleven wiring
      # gates assert that no job other than `web-build` runs a `build:web*` script. The
      # fetch is preceded by its own discard because the fetch action extracts **into**
      # the working directory, so a seventh fetch merged into the tree the offline lane
      # left behind would be a union of two builds that is neither of them.
      #
      # It gates, and the reason is the phase's runtime criterion: plan section 10.2's
      # frame-time target and the 100 ms interaction target had no browser evidence at
      # all before this step - `scripts/check-performance.mjs` states in its own output
      # that it reads a build rather than a browser. The step is not exempt from
      # failing, and no step in this job is; the wording here avoids naming the
      # exemption key, because several wiring gates assert on the raw text of a job
      # whose comments are part of what they check.
      #
      # Evidence is the same sanitized JSON the allowlisted upload below already takes:
      # the lane writes under `artifacts/compatibility-evidence/`, and it records no
      # trace, screenshot, or video.
      - name: Discard the offline-shell dist before the Pixi-dungeon download
        run: rm -rf dist
      - name: Download the Pixi-dungeon-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: pixi-dungeon-web-artifact
          path: .
      - name: Verify the Pixi-dungeon-flagged artifact identity
        run: npm run verify:web-artifact:pixi-dungeon
      - name: Run the Phase 22 Pixi dungeon frame-time lane
        run: npm run test:e2e:pixi-perf:recorded
      # Phase 22 route-change teardown lane, on the seventh flagged artifact, in this
      # same job.
      #
      # The artifact is built, recorded, verified and uploaded once by `web-build` and
      # fetched here, for the same reason the five flagged lanes above are: the browser
      # and the single Chromium install already exist in this job, and eleven wiring
      # gates assert that no job other than `web-build` runs any `build:web*` script. The
      # fetch is preceded by its own discard because the fetch action extracts **into**
      # the working directory, so an eighth fetch merged into the tree the frame-time
      # lane left behind would be a union of two builds that is neither of them.
      #
      # It gates, and the reason is the phase's central teardown criterion: plan section
      # 10.2's "correct Pixi Application and asset-bundle teardown" had no route-change
      # evidence at all before this step - the Phase 9 twenty-cycle lane remounts one
      # screen and cannot see a canvas or a WebGL context outlive a route, and
      # `scripts/check-memory.mjs` states in its own output that it reads a build rather
      # than a browser. The step is not exempt from failing, and no step in this job is;
      # the wording here avoids naming the exemption key, because several wiring gates
      # assert on the raw text of a job whose comments are part of what they check.
      #
      # Evidence is the same sanitized JSON the allowlisted upload below already takes:
      # the lane writes under `artifacts/compatibility-evidence/`, and it records no
      # trace, screenshot, or video.
      - name: Discard the Pixi-dungeon dist before the Pixi-route download
        run: rm -rf dist
      - name: Download the Pixi-route-flagged artifact
        uses: actions/download-artifact@v4
        with:
          name: pixi-route-web-artifact
          path: .
      - name: Verify the Pixi-route-flagged artifact identity
        run: npm run verify:web-artifact:pixi-route
      - name: Run the Phase 22 Pixi route-teardown lane
        run: npm run test:e2e:pixi-route:recorded
      - name: Upload sanitized browser-smoke evidence
        # Allowlist: sanitized per-run JSON evidence only, on the same terms as the
        # storage-v2 and compatibility lanes. Nothing else leaves the runner, and
        # this lane's own two output directories are deliberately outside the
        # allowlisted root. `always()` because a red run is the run whose measurements
        # a reader most needs.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-evidence
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            artifacts/playwright-report
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Phase 4 storage-v2 lane, and the Phase 5 fresh-profile restore lane.
  #
  # This is the ONE deliberately separate build in a complete CI run, and it is
  # not a second production artifact:
  #
  # - It builds with `VITE_STORAGE_REPOSITORY=v2` through `--mode storage-v2`,
  #   which reads `.env.storage-v2`. After the Phase 23 cutover the production
  #   default is also `VITE_STORAGE_REPOSITORY=v2` (with `legacy` as the rollback),
  #   so this lane is no longer a divergence in the storage flag; `web-build` above
  #   remains the single build, record, and upload point for the production
  #   `web-artifact`, and the extra value this lane adds is the Phase 5 data
  #   products plus the recorded migration evidence.
  # - The build is `build:storage-v2-data-products`, which is that same flagged
  #   build with one extra flag value, `VITE_DATA_PRODUCTS_V2=true`, in the
  #   environment. It is a strict superset, so one artifact serves both lanes and
  #   the artifact is still built exactly once. `VITE_STORAGE_REPOSITORY` still
  #   comes only from `.env.storage-v2`; see `scripts/build-flagged-data-products.mjs`
  #   for why the owner flag is set in the environment rather than in that file.
  # - It records its identity to its OWN manifest file
  #   (`artifacts/web-artifact-manifest-storage-v2.json`), so a flagged build can
  #   never be mistaken for, or overwrite, the shared production artifact
  #   identity, and `browser-smoke` and `compatibility-pr` are unaffected.
  # - That manifest also records a hash of the git-tracked source, so the four
  #   lanes below cannot certify a `dist` left over from an older source state.
  #   All four run in this one job against this one checkout, so the source
  #   identity is the same for the build, the record, and every lane, and no lane
  #   ever builds a second artifact to keep it that way.
  # - It runs one representative host only (Linux/Chromium). A real IndexedDB
  #   migration does not vary by engine the way rendering does, and keeping the
  #   lane to one cell is what stops a pull request from paying for eight
  #   browser installs. Cross-engine coverage of this spec stays a later,
  #   separately authorized release-candidate decision.
  # - It uploads only the allowlisted sanitized JSON evidence, never the
  #   Playwright HTML report, a trace, a screenshot, or test results.
  storage-v2-browser:
    name: Browser (Storage v2 Flagged Build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the flagged storage-v2 artifact with the Phase 5 products on
        run: npm run build:storage-v2-data-products
      - name: Record the flagged storage-v2 artifact identity
        run: npm run record:web-artifact:storage-v2
      - name: Verify the flagged storage-v2 artifact identity
        run: npm run verify:web-artifact:storage-v2
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the storage-v2 flagged-build lane
        run: npm run test:e2e:storage:recorded
      # Phase 5 fresh-profile restore lane.
      #
      # It is a *step in this job*, not a job of its own, for one reason: the
      # flagged artifact exists only here, and this job deliberately uploads
      # evidence only. A separate job would have to build the artifact a second
      # time, which is exactly the duplication this lane must avoid. Two steps keep
      # one build, one Chromium install, and one upload, and leave `web-build` as
      # the single production build, record, and upload point.
      #
      # The step gates. It gates because the product it exercises now exists and
      # the lane is the phase's acceptance evidence for the fresh-profile restore
      # deliverable; a `continue-on-error` here would turn a restore regression into
      # a green run. `tests/e2e/data-products-lane.test.ts` asserts the step does
      # NOT carry `continue-on-error`, so the exemption cannot creep back in.
      - name: Run the fresh-profile data-product restore lane
        run: npm run test:e2e:data-products:recorded
      # Phase 6 individual-subject backup lane.
      #
      # A third *step in this job*, for the same reason as the one above: the flagged
      # artifact with `VITE_DATA_PRODUCTS_V2=true` exists only here, this job uploads
      # evidence only and never `dist`, and a job of its own would have to build the
      # artifact a second time. One build, one Chromium install, one upload.
      #
      # It gates. `.kdsubject` had no browser evidence at all before this lane: the
      # only substrate for its central risk - a destructive or partial write against
      # a real device - was the `fake-indexeddb` shim. A restore or refusal regression
      # has to be a red run, so `tests/e2e/subject-product-lane.test.ts` asserts that
      # this step is not exempt from failing. The wording here deliberately avoids
      # naming the exemption key, because Phase 5's wiring gate asserts on the raw
      # text of this job and a comment that spelled it out would fail that gate.
      - name: Run the individual-subject backup lane
        run: npm run test:e2e:subject-product:recorded
      # Reload-persistence lane.
      #
      # A *fourth* step in this job, for the same reason as the ones above: the
      # flagged artifact with `VITE_DATA_PRODUCTS_V2=true` exists only here, this
      # job uploads evidence only and never the artifact itself, and a job of its
      # own would have to produce it a second time. One artifact, one Chromium
      # install, one upload.
      #
      # It gates, and the reason is sharper than for the three above: a
      # cross-phase data-loss defect shipped through two accepted phases because
      # every gate read the active generation directly - the write's destination,
      # and exactly the generation the next boot superseded. The only test that
      # could see it creates a subject through the application's own Welcome form,
      # performs each of the three product writes, reloads, and asserts the
      # subjects are still listed. `tests/e2e/reload-persistence-lane.test.ts`
      # asserts that this step's result is the job's result, so the exemption
      # cannot creep back in. The wording avoids naming that exemption key,
      # because the Phase 5 wiring gate asserts on the raw text of this job.
      - name: Run the reload-persistence lane
        run: npm run test:e2e:reload-persistence:recorded
      - name: Upload sanitized storage-v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only.
          name: storage-v2-evidence
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14

  compatibility-pr:
    name: Compatibility PR ${{ matrix.id }}
    needs: [web-build]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pr-linux-chromium
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-chromium
            expect_host: linux
            install_args: --with-deps
            install: chromium
          - id: pr-linux-firefox
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-firefox
            expect_host: linux
            install_args: --with-deps
            install: firefox
          - id: pr-macos-webkit
            lane: pull-request
            os: macos
            runs_on: macos-latest
            project: compat-webkit
            expect_host: macos
            install_args: ''
            install: webkit
          - id: pr-windows-edge
            lane: pull-request
            os: windows
            runs_on: windows-latest
            project: compat-edge
            expect_host: windows
            install_args: ''
            install: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - name: Install the lane browser
        run: npx playwright install ${{ matrix.install_args }} ${{ matrix.install }}
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the compatibility lane
        env:
          KD_COMPAT_EXPECT_HOST: ${{ matrix.expect_host }}
        run: npm run test:e2e:compat:recorded -- --project=${{ matrix.project }}
      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only. No Playwright HTML
          # report, trace, screenshot, or test-results directory is uploaded.
          name: compatibility-evidence-${{ matrix.id }}
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14
