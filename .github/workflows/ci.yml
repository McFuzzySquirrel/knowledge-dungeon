name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Typecheck (App, Node, Electron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  web-build:
    name: Web Build and Bundle
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build:web
      - run: npm run check:bundle-size
      - run: npm run record:build-metadata
      - name: Record the shared production artifact identity
        run: npm run record:web-artifact
      - name: Verify the shared production artifact identity
        run: npm run verify:web-artifact
      - name: Upload build metadata
        uses: actions/upload-artifact@v4
        with:
          name: web-build-metadata
          path: artifacts/build-metadata.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the shared production web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-artifact
          path: |
            dist
            artifacts/web-artifact-manifest.json
          if-no-files-found: error
          retention-days: 14

  browser-smoke:
    name: Browser Smoke (Chromium Matrix)
    runs-on: ubuntu-latest
    needs: [web-build]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the current-build viewport suite against the shared artifact
        run: npm run test:e2e:recorded
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-report
          path: |
            artifacts/playwright-report
            artifacts/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Phase 4 storage-v2 lane.
  #
  # This is the ONE deliberately separate build in a complete CI run, and it is
  # not a second production artifact:
  #
  # - It builds with `VITE_STORAGE_REPOSITORY=v2` through `--mode storage-v2`,
  #   which reads `.env.storage-v2`. The production default stays
  #   `VITE_STORAGE_REPOSITORY=legacy`, so `web-build` above remains the single
  #   build, record, and upload point for the production `web-artifact`.
  # - It records its identity to its OWN manifest file
  #   (`artifacts/web-artifact-manifest-storage-v2.json`), so a flagged build can
  #   never be mistaken for, or overwrite, the shared production artifact
  #   identity, and `browser-smoke` and `compatibility-pr` are unaffected.
  # - It runs one representative host only (Linux/Chromium). A real IndexedDB
  #   migration does not vary by engine the way rendering does, and keeping the
  #   lane to one cell is what stops a pull request from paying for eight
  #   browser installs. Cross-engine coverage of this spec stays a later,
  #   separately authorized release-candidate decision.
  # - It uploads only the allowlisted sanitized JSON evidence, never the
  #   Playwright HTML report, a trace, a screenshot, or test results.
  storage-v2-browser:
    name: Browser (Storage v2 Flagged Build)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Build the flagged storage-v2 artifact
        run: npm run build:storage-v2-flagged
      - name: Record the flagged storage-v2 artifact identity
        run: npm run record:web-artifact:storage-v2
      - name: Verify the flagged storage-v2 artifact identity
        run: npm run verify:web-artifact:storage-v2
      - run: npx playwright install --with-deps chromium
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the storage-v2 flagged-build lane
        run: npm run test:e2e:storage:recorded
      - name: Upload sanitized storage-v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only.
          name: storage-v2-evidence
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14

  compatibility-pr:
    name: Compatibility PR ${{ matrix.id }}
    needs: [web-build]
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: pr-linux-chromium
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-chromium
            expect_host: linux
            install_args: --with-deps
            install: chromium
          - id: pr-linux-firefox
            lane: pull-request
            os: linux
            runs_on: ubuntu-latest
            project: compat-firefox
            expect_host: linux
            install_args: --with-deps
            install: firefox
          - id: pr-macos-webkit
            lane: pull-request
            os: macos
            runs_on: macos-latest
            project: compat-webkit
            expect_host: macos
            install_args: ''
            install: webkit
          - id: pr-windows-edge
            lane: pull-request
            os: windows
            runs_on: windows-latest
            project: compat-edge
            expect_host: windows
            install_args: ''
            install: msedge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Download the shared production artifact
        uses: actions/download-artifact@v4
        with:
          name: web-artifact
          path: .
      - name: Verify the shared artifact identity
        run: npm run verify:web-artifact
      - name: Install the lane browser
        run: npx playwright install ${{ matrix.install_args }} ${{ matrix.install }}
      - name: Record the runner image and toolchain
        shell: bash
        run: |
          echo "runner image: ${ImageOS:-unavailable} ${ImageVersion:-unavailable}"
          node --version
          npm --version
          npx playwright --version
      - name: Run the compatibility lane
        env:
          KD_COMPAT_EXPECT_HOST: ${{ matrix.expect_host }}
        run: npm run test:e2e:compat:recorded -- --project=${{ matrix.project }}
      - name: Upload sanitized compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Allowlist: sanitized per-run JSON evidence only. No Playwright HTML
          # report, trace, screenshot, or test-results directory is uploaded.
          name: compatibility-evidence-${{ matrix.id }}
          path: artifacts/compatibility-evidence
          if-no-files-found: warn
          retention-days: 14
